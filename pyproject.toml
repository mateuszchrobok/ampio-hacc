[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ampio-hacc"
version = "0.0.3"
description = "Home Assistant Custom Component for Ampio Smart Home System"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["paho-mqtt>=2.0.0", "voluptuous>=0.13.0", "attrs>=21.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.5.0",
    "homeassistant>=2024.1.0",
]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "RUF"]
# Ignore UP (pyupgrade) rules for existing codebase with legacy type annotations
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["custom_components/ampio"]

[tool.coverage.report]
fail_under = 30
